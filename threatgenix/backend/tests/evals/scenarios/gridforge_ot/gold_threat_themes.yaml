critical_themes:
- id: GRID-01
  title: Remote maintenance privilege abuse
  description: Interactive vendor access can be escalated into unauthorized control-adjacent
    actions.
  severity: Critical
  stride_categories:
  - Elevation of Privilege
  affected_assets:
  - VPN Gateway
  - OT Jump Host
  - Maintenance Orchestrator
- id: GRID-02
  title: Command package tampering
  description: Manipulation of staged command or recipe data can affect plant operations
    or safety.
  severity: Critical
  stride_categories:
  - Tampering
  affected_assets:
  - PLC Command Store
  - Maintenance Orchestrator
- id: GRID-03
  title: Loss of plant visibility
  description: Telemetry or historian outage can blind operators to unsafe or unstable
    plant conditions.
  severity: Critical
  stride_categories:
  - Denial of Service
  affected_assets:
  - Telemetry Broker
  - Plant Historian
- id: GRID-04
  title: Contractor to OT-core pivot
  description: External access paths can enable lateral movement from DMZ systems
    into field gateways.
  severity: Critical
  stride_categories:
  - Elevation of Privilege
  - Tampering
  affected_assets:
  - OT Jump Host
  - Field Gateway
- id: GRID-05
  title: Telemetry integrity manipulation
  description: Altered sensor streams can mislead analytics, operators, or maintenance
    workflows.
  severity: High
  stride_categories:
  - Tampering
  - Repudiation
  affected_assets:
  - Telemetry Broker
  - Predictive Analytics Service
- id: GRID-06
  title: Supplier upload abuse
  description: Supplier work orders can become a path for malicious payloads or unauthorized
    change requests.
  severity: High
  stride_categories:
  - Spoofing
  - Tampering
  affected_assets:
  - Maintenance Orchestrator
- id: GRID-07
  title: Historian data leakage
  description: Operational telemetry can reveal plant capacity, incident state, or
    proprietary processes.
  severity: High
  stride_categories:
  - Information Disclosure
  affected_assets:
  - Plant Historian
important_themes:
- id: GRID-08
  title: Analytics trust erosion
  description: Recommendations from predictive analytics may be over-trusted or insufficiently
    reviewed.
  severity: Medium
  stride_categories:
  - Repudiation
  - Tampering
  affected_assets:
  - Predictive Analytics Service
- id: GRID-09
  title: Emergency operator spoofing
  description: High-stress emergency access can create identity assurance gaps.
  severity: High
  stride_categories:
  - Spoofing
  affected_assets:
  - Site Reliability Analyst
  - VPN Gateway
- id: GRID-10
  title: Field gateway overload
  description: Maintenance bursts or malformed jobs can degrade field communications.
  severity: High
  stride_categories:
  - Denial of Service
  affected_assets:
  - Field Gateway
- id: GRID-11
  title: DMZ analytics bypass
  description: Analytics paths must not become covert write paths into OT control
    assets.
  severity: High
  stride_categories:
  - Elevation of Privilege
  affected_assets:
  - Predictive Analytics Service
  - Maintenance Orchestrator
expected_stride_coverage:
- Spoofing
- Tampering
- Repudiation
- Information Disclosure
- Denial of Service
- Elevation of Privilege
critical_assets:
- VPN Gateway
- OT Jump Host
- Field Gateway
- Plant Historian
- PLC Command Store
critical_boundaries:
- External Access Zone
- Plant DMZ
- OT Core Zone
top_severity_expectations:
- GRID-01
- GRID-02
- GRID-03
- GRID-04
must_not_hallucinate:
- Consumer mobile ad tracking
- Hospital patient portal
- Retail checkout skimmer
