description: Hybrid utility control platform spanning customer outage channels, DER
  dispatch, OT switching, vendor diagnostics, field mobility, emergency coordination,
  and immutable records.
system_name: Aurora Utility DER Orchestration and Storm Response Platform
data_classification: Restricted
regulatory_scope:
- NERC CIP
- NIST
- ISO 27001
- PCI DSS
deployment_model: hybrid
critical_components:
- DER Orchestration Engine
- Outage Command Center
- SCADA / ADMS Interface
- Break-Glass Dispatch Console
- Vendor Access Broker
- Market Settlement Ledger
- Audit and Decision Vault
critical_flows:
- DER Aggregator Partner -> API Mediation Gateway (DER flexibility availability feed)
- Load Forecasting Service -> DER Orchestration Engine (load shed and restoration
