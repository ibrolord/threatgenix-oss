threats:
- id: 80c20980-ae9a-57d5-806b-24210b3930d3
  display_id: AUR-T001
  description: Forged or replayed DER aggregator availability updates cause unsafe
    dispatch commitments during a storm restoration window.
  stride_category: Spoofing
  threat_subtype: partner callback trust failure
  severity: Critical
  source: Manual
  status: Open
  rule_id: AUR-01
  affected_node_ids:
  - a925a6e3-6503-52e4-87e4-0cdf28838936
  - 48060bdd-74b1-5182-8f8b-b0a0a3511f2b
  - 80379613-e2ff-58c5-b8d1-f260bc29fa4f
  affected_edge_ids:
  - 64497e5b-cde6-5ee3-8959-415211db2fd4
  - 5760906e-e4a2-5e3b-a881-277b511d0eb9
  relevance_rationale: The platform accepts partner flexibility signals under incident
    pressure and uses them to commit load relief into market and OT control paths.
  mitigation_plan: Require deterministic payload signing with replay windows, enforce
    partner sequence numbers, and quarantine stale flexibility updates during incident
    mode.
  mitigation_owner: DER Platform Lead
  due_date: '2026-06-15'
  mitigation_notes: Partner currently supports mTLS but not monotonic sequence enforcement.
  control_effectiveness: partial
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: c4498cec-8d7b-5ea5-88bd-130cbcbaf188
  display_id: AUR-T002
  description: An operator abuses emergency dispatch override to issue unreviewed
    load-shed or feeder reconfiguration commands.
  stride_category: Elevation of Privilege
  threat_subtype: break-glass misuse
  severity: Critical
  source: Manual
  status: Open
  rule_id: AUR-02
  affected_node_ids:
  - d388d76d-8270-52ae-93c0-ca78b69f0bfc
  - 80379613-e2ff-58c5-b8d1-f260bc29fa4f
  - b3cc94af-e2fd-57c9-9688-c7606e49dbcc
  affected_edge_ids:
  - 4205126b-6e77-5495-b332-bad1ca1a7285
  - cc491140-88e0-53d3-9881-f035c99c19d6
  relevance_rationale: Storm mode compresses approvals and explicitly introduces emergency
    privileges with real operational blast radius.
  mitigation_plan: Enforce dual-control for emergency overrides, bind approvals to
    named events, and require post-action attestation within immutable audit.
  mitigation_owner: Operations Security Manager
  due_date: '2026-05-31'
  mitigation_notes: Current console records approvals but does not prevent same-user
    initiate/approve.
  control_effectiveness: partial
  residual_risk_level: Critical
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: acf2f0ac-80e8-5312-a698-5582cddbb1e7
  display_id: AUR-T003
  description: A brokered vendor diagnostics session pivots into the OT control plane
    and reaches switching logic or firmware workflows.
  stride_category: Tampering
  threat_subtype: third-party support pivot
  severity: Critical
  source: Manual
  status: Open
  rule_id: AUR-03
  affected_node_ids:
  - 76f07e0c-1adf-5153-88be-af8bccee4bbd
  - 402d0d3e-74f4-521e-ab20-c191badbadd8
  - b3cc94af-e2fd-57c9-9688-c7606e49dbcc
  - a696152b-d944-5c71-a3ea-76c36bd30247
  affected_edge_ids:
  - 98cddfa1-e846-57c5-856f-24664f444d9b
  - befeb908-22d6-5084-8008-fc6dcdbad2c5
  relevance_rationale: The vendor path is legitimate, privileged, and incident-driven,
    which makes it a high-value lateral-movement candidate.
  mitigation_plan: Constrain vendor sessions to read-only diagnostics, force signed
    work orders, and separate firmware release authority from diagnostics.
  mitigation_owner: OT Security Lead
  due_date: '2026-06-01'
  mitigation_notes: Vendor enclave is time-boxed but still reaches shared SCADA service
    accounts.
  control_effectiveness: partial
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: 72c82837-947d-5676-979a-7a8323fa990f
  display_id: AUR-T004
  description: A stale offline work package is replayed from a field tablet after
    topology changed, causing unsafe switching guidance.
  stride_category: Tampering
  threat_subtype: offline replay
  severity: High
  source: Manual
  status: Open
  rule_id: AUR-04
  affected_node_ids:
  - 75524cd1-d0fe-5ed3-815d-3442117ebd13
  - a429722a-b6d5-5ea9-b521-2df4ba7e1414
  - e993dddc-cdff-5a09-a23c-e16a071a259b
  affected_edge_ids:
  - e3cec7ee-968c-5069-8439-1bb5c3fdc74b
  - 2552beaf-a372-5ba0-b32a-b5765d1694ca
  relevance_rationale: Offline-first field operations are essential during storms,
    but they create stale-authority risk and delayed consensus.
  mitigation_plan: Add work package epoching, mandatory topology freshness checks,
    and local tablet invalidation on breaker-state drift.
  mitigation_owner: Field Operations Product Owner
  due_date: '2026-06-20'
  mitigation_notes: Current packages can remain valid for four hours without revalidation.
  control_effectiveness: none
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: ba0d7453-99a0-524d-a32b-97f2ce1f8aef
  display_id: AUR-T005
  description: Manipulated AMI telemetry drives incorrect load-shed recommendations
    and masks feeder stress in the forecasting pipeline.
  stride_category: Information Disclosure
  threat_subtype: telemetry poisoning
  severity: Critical
  source: Manual
  status: Open
  rule_id: AUR-05
  affected_node_ids:
  - 87b6bc1a-7038-545f-9d89-a96ab9f96b52
  - 9ff91834-81d5-5c2a-bae3-cd060d8a2802
  - 800c3ca3-742d-52ad-9b42-e5e75eb28eb2
  affected_edge_ids:
  - dff0612a-ce87-55f1-bacb-21732afe212c
  - cc25d22c-4ebc-5873-9220-2f083eb7edf6
  - 371135ab-dcda-5c0b-be99-208955a3b8b2
  relevance_rationale: The platform treats telemetry as operational truth, so poisoned
    measurements create both safety and trust impacts.
  mitigation_plan: Introduce anomaly scoring across feeder telemetry, signed meter
    batches, and dispatch hold conditions when telemetry confidence drops.
  mitigation_owner: Analytics Engineering Manager
  due_date: '2026-07-01'
  mitigation_notes: Current validation focuses on message syntax, not cross-feeder
    plausibility.
  control_effectiveness: partial
  residual_risk_level: Critical
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: f29ebd4f-c3b0-577a-a02c-ec975e924432
  display_id: AUR-T006
  description: The public outage experience leaks restoration sequencing, feeder naming,
    or critical-facility prioritization that improves attacker recon.
  stride_category: Information Disclosure
  threat_subtype: metadata leakage
  severity: Medium
  source: Manual
  status: Open
  rule_id: AUR-06
  affected_node_ids:
  - e3650994-227e-50cc-885b-6ecb03d4a668
  - e993dddc-cdff-5a09-a23c-e16a071a259b
  affected_edge_ids:
  - 7c3a5375-23f6-5f95-85da-21af5161f653
  - f14a5859-6496-5250-bd0e-e1ba06d50a32
  relevance_rationale: No direct compromise is required; over-shared public metadata
    can expose real operational priorities and timing.
  mitigation_plan: Separate public incident summaries from internal feeder labels
    and suppress priority rationale for hospitals and shelters.
  mitigation_owner: Digital Channels Manager
  due_date: '2026-05-15'
  mitigation_notes: Status publisher currently reuses internal feeder labels in some
    payloads.
  control_effectiveness: partial
  residual_risk_level: Medium
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: 0101dd73-f426-5216-a353-134aa5c28421
  display_id: AUR-T007
  description: Compromise or misuse of firmware signing authority deploys malicious
    or unstable packages to substation gateways.
  stride_category: Elevation of Privilege
  threat_subtype: signing chain compromise
  severity: Critical
  source: Manual
  status: Open
  rule_id: AUR-07
  affected_node_ids:
  - a696152b-d944-5c71-a3ea-76c36bd30247
  - 45ab1c20-f573-57e4-aedf-7db386a0606a
  - 402d0d3e-74f4-521e-ab20-c191badbadd8
  affected_edge_ids:
  - 7dd4129e-7c36-5618-9b0c-cd1fe8420e1b
  - befeb908-22d6-5084-8008-fc6dcdbad2c5
  relevance_rationale: Firmware provenance is a concentrated trust anchor with broad
    blast radius across field assets.
  mitigation_plan: Move release signing into dual-party HSM-backed workflow and require
    out-of-band attestation before field rollout.
  mitigation_owner: Platform Engineering Director
  due_date: '2026-06-30'
  mitigation_notes: Signer custody exists but release approval is still single-admin.
  control_effectiveness: partial
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: 62b81a54-d35c-5ed8-bb00-acbb0d3932d0
  display_id: AUR-T008
  description: Settlement records diverge from dispatch intent, enabling repudiation
    of energy commitments or customer compensation.
  stride_category: Repudiation
  threat_subtype: ledger inconsistency
  severity: High
  source: Manual
  status: Open
  rule_id: AUR-08
  affected_node_ids:
  - 80379613-e2ff-58c5-b8d1-f260bc29fa4f
  - 90188cd1-1d4a-53f0-a292-cf2feba7e3f6
  - c97cb084-f004-53eb-b467-8aaf4ae92229
  affected_edge_ids:
  - 4b99d69e-7cd8-5678-9a0e-76181ac87a9f
  - 5d3c631b-4981-541b-9b5d-d156e8fdb5af
  relevance_rationale: The utility must prove who decided what, when, and on which
    telemetry basis across both market and public-restoration workflows.
  mitigation_plan: Bind settlement writes to immutable decision records and perform
    hourly reconciliation between market commitments and field execution.
  mitigation_owner: Market Operations Manager
  due_date: '2026-06-10'
  mitigation_notes: Audit data exists but is not yet cryptographically bound to settlement
    entries.
  control_effectiveness: substantial
  residual_risk_level: Medium
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: c8daea09-f443-5d2e-8c08-747c8bfbe7ca
  display_id: AUR-T009
  description: Emergency restoration priorities are manipulated to favor non-critical
    feeders or partner interests over hospitals and shelters.
  stride_category: Tampering
  threat_subtype: priority queue abuse
  severity: High
  source: Manual
  status: Open
  rule_id: AUR-09
  affected_node_ids:
  - cd3c0f54-0ffd-526a-8b42-b0acbbee9afd
  - e993dddc-cdff-5a09-a23c-e16a071a259b
  - a429722a-b6d5-5ea9-b521-2df4ba7e1414
  affected_edge_ids:
  - bb82c03a-69c7-5cd4-a014-c55647a308b0
  - e3cec7ee-968c-5069-8439-1bb5c3fdc74b
  relevance_rationale: Priority manipulation is subtle, business-context-driven, and
    likely to happen during public scrutiny rather than through a noisy exploit.
  mitigation_plan: Require critical-load registry corroboration and second-party sign-off
    before high-impact priority overrides propagate to field work.
  mitigation_owner: Incident Command Lead
  due_date: '2026-05-25'
  mitigation_notes: EOC feed is trusted operationally but not always cross-checked
    against utility critical-load registry.
  control_effectiveness: partial
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
- id: 79e5b670-e301-58f1-84bb-ac8ef9940579
  display_id: AUR-T010
  description: Partial historian coverage or delayed telemetry replication hides unauthorized
    switching and weakens incident reconstruction.
  stride_category: Denial of Service
  threat_subtype: telemetry visibility gap
  severity: High
  source: Manual
  status: Open
  rule_id: AUR-10
  affected_node_ids:
  - 5713f5ce-4156-563b-9f86-01b67cf60564
  - 8f1a38c6-d006-5792-a898-91e3ba673d96
  - c97cb084-f004-53eb-b467-8aaf4ae92229
  affected_edge_ids:
  - 2dcb8d5f-19ce-557c-9909-936469ece381
  - 3a0eb2c2-ec49-5221-b6ef-c946de84ece4
  relevance_rationale: Visibility failures create false confidence and make both operational
    recovery and root-cause analysis materially harder.
  mitigation_plan: Alert on historian lag by feeder, capture last-known-good topology
    snapshots, and block sensitive closeouts when telemetry coverage is incomplete.
  mitigation_owner: Operational Observability Lead
  due_date: '2026-06-05'
  mitigation_notes: Telemetry replication currently tolerates fifteen-minute lag without
    escalation.
  control_effectiveness: none
  residual_risk_level: High
  created_at: '2026-04-18T09:00:00Z'
  updated_at: '2026-04-18T09:00:00Z'
assumptions:
