      display_id: AUR-T001
      description: Forged or replayed DER aggregator availability updates cause unsafe
        dispatch commitments during a storm restoration window.
      severity: Critical
      stride_category: Spoofing
      status: Open
      mitigation_plan: Require deterministic payload signing with replay windows,
        enforce partner sequence numbers, and quarantine stale flexibility updates
        during incident mode.
      mitigation_owner: DER Platform Lead
      due_date: '2026-06-15'
      mitigation_notes: Partner currently supports mTLS but not monotonic sequence
        enforcement.
      control_effectiveness: partial
      residual_risk_level: High
